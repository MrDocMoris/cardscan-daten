name: Yu-Gi-Oh Preise aktualisieren

on:
  schedule:
    - cron: "23 4 */2 * *"   # alle zwei Tage früh morgens
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cardmarket-Preise je Druck zuordnen
        run: node tools/build-ygo-prices.js
      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "Preise aktualisiert ($(date +%d.%m.%Y))"
          git push
