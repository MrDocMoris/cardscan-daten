name: Cardmarket-Preisliste testen
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for g in 1 3 6; do
            for u in "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_$g.json" "https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$g.json"; do
              code=$(curl -s -o /tmp/f.json -w "%{http_code}" "$u"); echo "$u -> $code $(stat -c %s /tmp/f.json)"; head -c 400 /tmp/f.json; echo; echo
            done
          done
          curl -s "https://api.scryfall.com/cards/named?exact=Sol%20Ring" | python3 -c "import sys,json;d=json.load(sys.stdin);print('scryfall cardmarket_id', d.get('cardmarket_id'))"
          curl -s "https://api.tcgdex.net/v2/en/cards/sv03.5-006" | python3 -c "import sys,json;d=json.load(sys.stdin);print('tcgdex pricing', json.dumps(d.get('pricing',{}).get('cardmarket'))[:400])"
